<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-storage');
          var theme;
          if (stored) {
            theme =
              JSON.parse(stored)?.state?.theme === 'dark' ? 'dark' : 'light';
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save and organize your bookmarks in one place."
    />
    <meta property="og:title" content="Bookmark Harbor" />
    <meta
      property="og:description"
      content="Save and organize your bookmarks in one place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bookmark Harbor" />
    <meta
      name="twitter:description"
      content="Save and organize your bookmarks in one place."
    />
    <link rel="canonical" href="https://yourdomain.com" />
    <title>Bookmark Harbor</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
